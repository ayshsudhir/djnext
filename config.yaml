# djnext settings (all optional). Only used for the mix points and hot cues.

timing:
  max_play_seconds: 240      # play roughly this much of each track before mixing out
  mix_overlap_seconds: 30    # how long two tracks overlap

bpm:
  tolerance: 0.06            # the DDJ-FLX4's default tempo range (+/-6%)

# beginner = shorter blends (max 16 bars), simpler mixes. advanced = blends up to 32 bars.
skill: beginner
