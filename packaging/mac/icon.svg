<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2238"/><stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#ff5a50" stop-opacity=".35"/><stop offset=".6" stop-color="#8b6cff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lbl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <radialGradient id="grooves" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1a1a1f"/><stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e7ef"/><stop offset="1" stop-color="#9a97a6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".55"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#sh)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- record -->
    <circle cx="480" cy="540" r="300" fill="url(#grooves)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="3">
      <circle cx="480" cy="540" r="280"/><circle cx="480" cy="540" r="255"/><circle cx="480" cy="540" r="230"/>
      <circle cx="480" cy="540" r="205"/><circle cx="480" cy="540" r="180"/><circle cx="480" cy="540" r="155"/>
    </g>
    <path d="M480 240 A300 300 0 0 1 760 400 L480 540 Z" fill="#fff" fill-opacity=".05"/>
    <circle cx="480" cy="540" r="110" fill="url(#lbl)"/>
    <circle cx="480" cy="540" r="110" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="14"/>
    <circle cx="480" cy="540" r="16" fill="#0d0b14"/>
    <!-- tonearm -->
    <circle cx="790" cy="250" r="46" fill="#3a3646"/><circle cx="790" cy="250" r="24" fill="url(#arm)"/>
    <path d="M790 250 L790 560 L700 660" fill="none" stroke="url(#arm)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="660" y="640" width="70" height="44" rx="8" transform="rotate(-45 695 662)" fill="#d9d6e2"/>
    <!-- level meter -->
    <g transform="translate(770 860)">
      <rect x="0" y="-60" width="18" height="60" rx="4" fill="#3ee0a0"/>
      <rect x="28" y="-100" width="18" height="100" rx="4" fill="#ffc857"/>
      <rect x="56" y="-76" width="18" height="76" rx="4" fill="#ff7a45"/>
      <rect x="84" y="-120" width="18" height="120" rx="4" fill="#ff3d8b"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
</svg>
