[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "djnext"
version = "0.2.1"
description = "Order a rekordbox playlist into a DJ set that follows an energy curve (DDJ-FLX4 friendly)."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "pyyaml>=6",
    "pyrekordbox>=0.4.4,<0.5",   # rekordbox's library; 0.5 renamed modules djnext uses, so stay on the tested 0.4.x
    "yt-dlp",             # read your SoundCloud likes/playlists (track lists only)
    "fastapi>=0.100",     # local web page
    "uvicorn>=0.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "httpx"]
mac = ["pywebview>=5"]   # own window for the Mac app (packaging/mac/build_app.sh)

[project.scripts]
djnext = "djnext.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djnext = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
