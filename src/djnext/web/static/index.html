<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>djnext</title>
<style>
  :root {
    --bg: #0d0c12; --card: #17151f; --line: #2a2735; --text: #f2f0f7; --dim: #9a95a8;
    --accent: #c6ff3d; --accent-ink: #11140a; --warn: #ffb547; --bad: #ff6b6b; --good: #7ee08a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 22px 16px 120px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  label.f { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 8px 12px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--line); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 13px; font: inherit; cursor: pointer; }
  .chips button span { color: var(--dim); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  .chips button.on span { color: var(--accent-ink); opacity: .7; }
  .chips button:disabled { opacity: .4; cursor: default; }
  .glist h3 { font-size: 14px; margin: 18px 0 4px; display: flex; justify-content: space-between; }
  .glist h3 span { color: var(--dim); font-weight: 400; }
  .guess { color: var(--warn); font-weight: 700; margin-right: 4px; cursor: help; }
  .prow select { width: auto; padding: 4px 6px; font-size: 12.5px; }
  select, input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; max-width: 100%; }
  select { width: 300px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 10px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .ghost { background: none; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .ghost:hover { border-color: var(--dim); }
  .link { background: none; border: 0; color: var(--dim); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  ol { list-style: none; margin: 0; padding: 0; }
  li.step { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  li.step:first-child { border-top: 0; }
  .num { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; padding-top: 1px; }
  .title { font-weight: 650; }
  .artist { color: var(--dim); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--line); color: var(--text); font-variant-numeric: tabular-nums; }
  .tag.known { background: #3b2f12; color: var(--warn); }
  .why { color: var(--text); font-size: 13.5px; margin-top: 6px; }
  .why.first { color: var(--dim); }
  .why .warn { color: var(--warn); }
  .cues { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  .cues b { color: var(--accent); font-weight: 600; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .opts { grid-column: 2 / 4; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
  .opt { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
  .opt:first-child { border-top: 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13,12,18,.96); border-top: 1px solid var(--line); }
  .bar .in { max-width: 820px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar input { flex: 1 1 200px; }
  .msg { font-size: 13.5px; margin-top: 10px; }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); } .msg.warn { color: var(--warn); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--dim); font-size: 14px; }
  .pool { margin-top: 10px; max-height: 340px; overflow: auto; }
  .prow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; align-items: center; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress div { height: 100%; background: var(--accent); transition: width .4s; }
  .empty { color: var(--dim); text-align: center; padding: 26px 0 10px; }
  @media (max-width: 560px) {
    select { width: 100%; }
    .row > div { width: 100%; }
    li.step { grid-template-columns: 26px 1fr; }
    .acts { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
    .opts { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
<main>
  <h1>dj<span>next</span></h1>
  <div class="sub" id="sub">Loading your likes…</div>

  <!-- first time: who are you on SoundCloud -->
  <section class="card" id="setup" hidden>
    <label class="f" for="scuser">Your SoundCloud profile link</label>
    <div class="row">
      <input type="text" id="scuser" placeholder="https://soundcloud.com/your-name" style="flex:1 1 260px">
      <button class="btn" id="syncBtn">Get my likes</button>
    </div>
    <div class="sub" style="margin-top:8px">djnext only ever uses the tracks you liked. Play each liked track once in rekordbox (or drag it into your collection) so it gets analysed.</div>
    <div class="msg" id="setupMsg"></div>
  </section>

  <!-- make a playlist -->
  <section class="card" id="maker" hidden>
    <label class="f">Genre</label>
    <div class="chips" id="genre"></div>
    <div class="row" style="margin-top:16px">
      <div>
        <label class="f">Tracks</label>
        <div class="seg" id="len">
          <button data-v="8">8</button><button data-v="12" class="on">12</button><button data-v="16">16</button><button data-v="20">20</button>
        </div>
      </div>
      <div>
        <label class="f">Shape</label>
        <div class="seg" id="shape">
          <button data-v="build" class="on">Warm up, then build</button><button data-v="peak">Peak time</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div>
        <label class="f" for="start">Start with</label>
        <select id="start"><option value="">Let djnext choose</option></select>
      </div>
      <button class="btn" id="makeBtn">Make playlist</button>
    </div>
    <div class="msg" id="makeMsg"></div>
  </section>

  <section class="card" id="result" hidden>
    <ol id="steps"></ol>
  </section>

  <details id="more" hidden>
    <summary id="moreSum">Your genre lists</summary>
    <div class="card">
      <div id="djline" class="sub"></div>
      <div class="progress" id="prog" hidden><div></div></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="djBtn">Find DJ pairs</button>
        <button class="ghost" id="resyncBtn">Update my likes</button>
        <button class="ghost" id="genresBtn">Send genre lists to rekordbox</button>
      </div>
      <div class="msg" id="genresMsg"></div>
      <div class="sub" id="countsLine" style="margin-top:10px"></div>
      <div class="sub" style="margin-top:6px"><span class="guess">?</span> = a guess (few clues). Use the menu to move a track to the right list; djnext remembers.</div>
      <div class="glist" id="pool"></div>
      <div id="removedBox"></div>
    </div>
  </details>
</main>

<div class="bar" id="bar" hidden>
  <div class="in">
    <input type="text" id="plName" aria-label="Playlist name">
    <button class="btn" id="sendBtn">Send to rekordbox with hot cues</button>
  </div>
  <div class="in" style="padding-top:0"><span class="sub" id="sendNote"></span></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null, PL = null, rbOpen = false;
let GENRE = (() => { try { return localStorage.getItem("djnext-genre") || ""; } catch (e) { return ""; } })();

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `Something went wrong (${r.status})`);
  return d;
}
function seg(id) { return $(id).querySelector(".on").dataset.v; }
for (const id of ["len", "shape"]) $(id).addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
});
function msg(el, text, kind) { $(el).className = "msg " + (kind || ""); $(el).textContent = text || ""; }

function renderStatus(s) {
  S = s;
  rbOpen = s.rekordbox_running;
  if (!s.soundcloud) { $("setup").hidden = false; $("maker").hidden = true; $("more").hidden = true; $("sub").textContent = "First, tell djnext who you are on SoundCloud."; return; }
  $("setup").hidden = true; $("maker").hidden = false; $("more").hidden = false;
  const c = s.counts;
  $("sub").textContent = `${s.pool} tracks from your SoundCloud likes, sorted into ${s.genres.filter(g => g.count).length} genre lists`;
  if (!s.genres.some(g => g.id === GENRE && g.count >= 3)) GENRE = (s.genres.slice().sort((a, b) => b.count - a.count)[0] || {}).id || "";
  renderGenres();
  $("moreSum").textContent = `Your genre lists (${s.pool} tracks)`;
  const L = s.lookup;
  $("prog").hidden = !L.running;
  if (L.running) {
    $("prog").firstElementChild.style.width = `${Math.round(100 * L.done / Math.max(1, L.total))}%`;
    $("djline").textContent = `Looking your tracks up in DJ tracklists… ${L.done} of ${L.total} (${L.current})`;
  } else {
    const left = s.pool - s.dj_checked;
    $("djline").textContent = left > 0
      ? `${left} track${left > 1 ? "s" : ""} not looked up in DJ tracklists yet. "Find DJ pairs" checks which of your tracks real DJs play together (about 15 seconds per track, only once).`
      : `${s.dj_found} of ${s.pool} tracks found in real DJ sets · ${s.history_sessions} of your own rekordbox sessions used.` + (L.error ? ` ${L.error}` : "");
  }
  $("djBtn").disabled = L.running || s.pool - s.dj_checked <= 0;
  $("countsLine").textContent = `From ${s.soundcloud.likes} likes: ${c.not_in_rekordbox} not in rekordbox yet, ${c.not_a_track} clips or DJ sets, ${c.duplicate} second uploads, ${c.removed} removed by you.`;
  const opts = (sel) => s.genres.map(g => `<option value="${g.id}" ${g.id === sel ? "selected" : ""}>${esc(g.name)}</option>`).join("");
  $("pool").innerHTML = s.genres.filter(g => g.count).map(g => `<h3>${esc(g.name)} <span>${g.count} tracks${g.guessed ? ` · ${g.guessed} guessed` : ""}</span></h3>` +
    s.tracks.filter(t => t.genre === g.id).sort((a, b) => a.bpm - b.bpm).map(t => `<div class="prow"><span>${t.genre_sure ? "" : `<span class="guess" title="${esc(t.genre_why)}">?</span>`}${esc(t.artist)} – ${esc(t.title)} <span class="sub">${t.bpm} · ${t.key}${t.dj_sets ? ` · in ${t.dj_sets} DJ sets` : ""}</span></span><span style="white-space:nowrap"><select data-move="${t.id}" aria-label="Move to genre">${opts(t.genre)}</select> <button class="link" data-rm="${t.id}">Don't use</button></span></div>`).join("")).join("");
  sendNote();
  if (L.running) setTimeout(refresh, 3000);
}

function renderGenres() {
  if (!S || !S.genres) return;
  $("genre").innerHTML = S.genres.filter(g => g.count).map(g => `<button data-genre="${g.id}" class="${g.id === GENRE ? "on" : ""}" ${g.count < 3 ? "disabled" : ""}>${esc(g.name)}<span>${g.count}</span></button>`).join("");
  const keep = $("start").value;
  const inGenre = S.tracks.filter(t => t.genre === GENRE).sort((a, b) => a.bpm - b.bpm);
  $("start").innerHTML = `<option value="">Let djnext choose</option>` + inGenre.map(t => `<option value="${t.id}">${esc(t.artist)} – ${esc(t.title)} (${t.bpm}, ${t.key})</option>`).join("");
  $("start").value = inGenre.some(t => t.id === keep) ? keep : "";
}

function cueText(cues) {
  if (!cues || !cues.length) return "";
  return "Hot cues: " + cues.map(c => `<b>${c.slot}</b> ${esc(c.at)} ${esc(c.what.split(":")[0].split(" (")[0].split(" > ")[0])}`).join(" · ");
}

function renderPlaylist(p) {
  PL = p;
  const has = p.steps && p.steps.length;
  $("result").hidden = !has; $("bar").hidden = !has;
  if (!has) return;
  if (!$("plName").dataset.touched || p.genre !== $("plName").dataset.genre) { $("plName").value = p.name; $("plName").dataset.genre = p.genre; delete $("plName").dataset.touched; }
  $("steps").innerHTML = p.steps.map((s, i) => `
    <li class="step" data-pos="${i}">
      <div class="num">${i + 1}</div>
      <div>
        <div><span class="title">${esc(s.title)}</span> <span class="artist">· ${esc(s.artist)}</span></div>
        <div class="tags"><span class="tag">${s.bpm} BPM</span><span class="tag">${esc(s.key)}</span>${s.known ? `<span class="tag known">crowd knows it</span>` : ""}${s.intro_bars != null ? `<span class="tag">${s.intro_bars}-bar intro</span>` : ""}</div>
        <div class="why ${i === 0 ? "first" : ""}">${i === 0 ? "Opener" : esc(s.why).replace(/^⚠ hard mix:/, '<span class="warn">⚠ hard mix:</span>')}</div>
        <div class="cues">${cueText(s.cues)}</div>
      </div>
      <div class="acts">${i > 0 ? `<button class="ghost" data-swap="${i}">Other options</button><button class="link" data-redo="${i}">Doesn't work after #${i}</button>` : ""}<button class="link" data-rm="${s.id}">Don't use</button></div>
    </li>`).join("");
}

function sendNote() {
  $("sendNote").textContent = rbOpen
    ? "Quit rekordbox first (Cmd+Q). djnext backs up your library, then adds this playlist to a “djnext” folder."
    : "Adds this playlist to a “djnext” folder in rekordbox, with hot cues E (cue in), F (swap the bass) and G (start the next track). A backup is made first.";
  $("sendBtn").disabled = rbOpen;
}

async function refresh() { try { renderStatus(await api("/api/status")); } catch (e) { $("sub").textContent = e.message; } }

$("syncBtn").onclick = async () => {
  $("syncBtn").disabled = true; msg("setupMsg", "Reading your likes from SoundCloud… (about 20 seconds)");
  try { renderStatus(await api("/api/soundcloud/sync", {user: $("scuser").value})); msg("setupMsg", ""); }
  catch (e) { msg("setupMsg", e.message, "err"); }
  $("syncBtn").disabled = false;
};
$("resyncBtn").onclick = async () => {
  $("resyncBtn").disabled = true; $("countsLine").textContent = "Reading your likes from SoundCloud…";
  try { renderStatus(await api("/api/soundcloud/sync", {user: ""})); } catch (e) { $("countsLine").textContent = e.message; }
  $("resyncBtn").disabled = false;
};
$("djBtn").onclick = async () => { renderStatus(await api("/api/djsets", {})); };
$("makeBtn").onclick = async () => {
  $("makeBtn").disabled = true; msg("makeMsg", "");
  try {
    renderPlaylist(await api("/api/playlist", {genre: GENRE, length: +seg("len"), shape: seg("shape"), start_id: $("start").value || null}));
    $("result").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) { msg("makeMsg", e.message, "err"); }
  $("makeBtn").disabled = false;
};
$("plName").addEventListener("input", () => { $("plName").dataset.touched = "1"; });

document.addEventListener("click", async (e) => {
  const t = e.target;
  const chip = t.closest("[data-genre]");
  if (chip) { GENRE = chip.dataset.genre; try { localStorage.setItem("djnext-genre", GENRE); } catch (e) {} renderGenres(); return; }
  try {
    if (t.dataset.swap) {
      const li = t.closest("li"); const open = li.querySelector(".opts");
      if (open) { open.remove(); return; }
      const d = await api("/api/playlist/options", {position: +t.dataset.swap});
      const box = document.createElement("div"); box.className = "opts";
      box.innerHTML = d.options.length ? d.options.map(o => `<div class="opt"><div><div><span class="title">${esc(o.title)}</span> <span class="artist">· ${esc(o.artist)}</span></div><div class="why">${esc(o.why)}</div></div><button class="ghost" data-use="${o.id}" data-at="${t.dataset.swap}">Use this</button></div>`).join("")
        : `<div class="sub">Nothing else mixes well here.</div>`;
      li.appendChild(box);
    } else if (t.dataset.use) {
      renderPlaylist(await api("/api/playlist/replace", {position: +t.dataset.at, track_id: t.dataset.use}));
    } else if (t.dataset.redo) {
      renderPlaylist(await api("/api/playlist/rebuild_from", {position: +t.dataset.redo}));
    } else if (t.dataset.rm) {
      const d = await api("/api/remove", {track_id: t.dataset.rm, out: true});
      renderStatus(d.status); renderPlaylist(d.playlist); showRemoved();
    } else if (t.dataset.back) {
      const d = await api("/api/remove", {track_id: t.dataset.back, out: false});
      renderStatus(d.status); showRemoved();
    }
  } catch (err) { msg("makeMsg", err.message, "err"); }
});

document.addEventListener("change", async (e) => {
  const id = e.target.dataset.move;
  if (!id) return;
  try { renderStatus(await api("/api/genre", {track_id: id, genre: e.target.value})); } catch (err) { msg("genresMsg", err.message, "err"); }
});

$("genresBtn").onclick = async () => {
  if (rbOpen) { msg("genresMsg", "Quit rekordbox first (Cmd+Q), then press the button again.", "warn"); return; }
  $("genresBtn").disabled = true; msg("genresMsg", "Writing to rekordbox…");
  try {
    const d = await api("/api/send_genres", {});
    msg("genresMsg", `Done: ${Object.entries(d.playlists).map(([n, c]) => `${n} (${c})`).join(", ")} are in rekordbox under Playlists → ${d.folder}. Sending again refreshes them.`, "ok");
  } catch (err) { msg("genresMsg", err.message, "err"); }
  $("genresBtn").disabled = false;
};

async function showRemoved() {
  const d = await api("/api/removed");
  $("removedBox").innerHTML = d.tracks.length ? `<div class="sub" style="margin-top:14px">Not used (${d.tracks.length})</div>` + d.tracks.map(t => `<div class="prow"><span class="sub">${esc(t.artist)} – ${esc(t.title)}</span><button class="link" data-back="${t.id}">Use again</button></div>`).join("") : "";
}

$("sendBtn").onclick = async () => {
  $("sendBtn").disabled = true; $("sendNote").textContent = "Writing to rekordbox…";
  try {
    const d = await api("/api/send", {name: $("plName").value});
    $("sendNote").innerHTML = `<span style="color:var(--good)">Done: “${esc(d.name)}” is in the ${esc(d.folder)} folder with ${d.tracks} tracks and ${d.cues} hot cues${d.cues_skipped ? ` (${d.cues_skipped} skipped: those pads were already used)` : ""}. Open rekordbox to play it.</span> <button class="link" id="undoBtn">Undo</button>`;
    $("undoBtn").onclick = async () => {
      if (!confirm("Put rekordbox back exactly as it was before this Send? Anything else you changed in rekordbox since then is lost too.")) return;
      try { await api("/api/undo", {}); $("sendNote").textContent = "Undone: rekordbox is back as it was."; } catch (e) { $("sendNote").textContent = e.message; }
    };
  } catch (e) { $("sendNote").innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
  $("sendBtn").disabled = rbOpen;
};

setInterval(async () => { try { const r = await api("/api/rekordbox"); if (r.running !== rbOpen) { rbOpen = r.running; sendNote(); } } catch (e) {} }, 4000);
refresh().then(async () => { const p = await api("/api/playlist"); if (p.steps.length) renderPlaylist(p); showRemoved(); });
</script>
</body>
</html>
